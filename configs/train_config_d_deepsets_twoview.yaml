# WP-D: Deep Sets + WP-C two-view consistency, CENTRED cosine (from
# train_config_c_twoview_ccos1_nmse.yaml, wp-c @ 62a5c8e).
# Raw-latent cosine is near-vacuous: this encoder's latent has ||mean||/spread = 3.9,
# giving raw matched cos 0.976 vs shuffled 0.935. Centred: 0.597 vs 0.011.
# See tests/latent_offset_control.py. Bench against THIS config.
model_name: rt_d_deepsets_twoview
data:
  preproc_type: PFPreProcessor
  val_split: 0.1
  pairwise: false
hyperparameters:
  num_epochs: 25
  early_stopping_patience: 5
  batch_size: 256
  mixed_prec: true
  lr: 0.001
  lr_min: 0.0
  lr_warmup: 0.05
  embed_size: 128
  num_heads: 8
  num_layers: 4
  latent_dim: 6
  proj_dim: 12
  linear_dim: null
  contrast_temp: 0.07
  contrastive_weight: 0.05
  contrastive_max: null
  contrastive_warmup: 0.05
  two_view: true
  consistency_weight: 1.0
  consistency_mse_weight: 0.1
  instance_weight: 0.0
  consistency_mse_normalized: true
  consistency_cos_centered: true
  seed: null
  encoder_class: DeepSetsEncoder
  use_degradation: true
