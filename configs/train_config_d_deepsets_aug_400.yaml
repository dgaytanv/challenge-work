# WP-D: best Deep Sets config (aug, B's generator) on WP-E's 400-candidate balanced file.
# Run with:
#   --data_cfg configs/data_config_train400_balanced.yaml
#   --data ~/hackathon-shared/data/train_400_balanced_160k.pt
# Verified [160000, 400, 8], 40k events per class, no padding rows.
# 4x the small file's token count, so expect a materially longer epoch; measured value
# goes in the report. Masked pooling is token-count agnostic, so nothing else changes.
model_name: rt_d_deepsets_aug_400
data:
  preproc_type: PFPreProcessor
  val_split: 0.1
  pairwise: false
hyperparameters:
  num_epochs: 25
  early_stopping_patience: 5
  batch_size: 256
  mixed_prec: true
  lr: 0.001
  lr_min: 0.0
  lr_warmup: 0.05
  embed_size: 128
  num_heads: 8
  num_layers: 4
  latent_dim: 6
  proj_dim: 12
  linear_dim: null
  contrast_temp: 0.07
  contrastive_weight: 0.05
  contrastive_max: null
  contrastive_warmup: 0.05
  encoder_class: DeepSetsEncoder
  use_degradation: true
